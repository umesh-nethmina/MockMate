# Render Blueprint: backend web service + Postgres (SRS 2.4). Deploy with "New > Blueprint" in Render.
# Secrets marked `sync: false` are entered in the Render dashboard; they never live in git (NFR-06).
services:
  - type: web
    name: mockmate-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mockmate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      # JSON list with the Vercel URL, e.g. ["https://mockmate.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
      # JSON list, e.g. ["you@example.com"]
      - key: ADMIN_EMAILS
        sync: false
      - key: DAILY_COST_CAP_USD
        value: "5.0"
      # Render web services cannot start Docker containers, so the coding round is off until a separate
      # sandbox host exists (see README, "Coding round in production").
      - key: SANDBOX_ENABLED
        value: "false"

databases:
  - name: mockmate-db
    databaseName: mockmate
    plan: basic-256mb
